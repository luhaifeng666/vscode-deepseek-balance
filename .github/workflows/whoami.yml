# 一次性诊断：查出这个身份的 Azure DevOps Resource ID。
#
# ⚠️ 拿到 ID 之后请把这个文件删掉 —— 它不是发布流程的一部分。
#
# 用法：Actions →「取 resource ID」→ Run workflow → 读日志里的 Resource ID。
#
# 它顺带在验证 release.yml 里那条 federated credential 是否配对：
# 这里走的 azure/login 和正式发布时是同一条 OIDC 路径，配错了现在就会暴露。

name: 取 resource ID

on:
  workflow_dispatch:

jobs:
  whoami:
    name: 查询身份
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 登录 Azure（OIDC，无需密钥）
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: 查询 Azure DevOps profile
        run: |
          # 早失败早看清：runner 上正常是预装好的
          az version
          echo ""

          PROFILE=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798)

          echo "==== 身份（确认是这个应用注册，不是你自己）===="
          echo "$PROFILE" | jq -r '.displayName'
          echo ""
          echo "==== Resource ID（阶段 05 填这个）===="
          echo "$PROFILE" | jq -r '.id'
